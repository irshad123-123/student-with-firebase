<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Student with firebase</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <h2 class="text-center bg-info p-2">Students Details</h2>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2 mt-4">
                <form id="studentForm">
                    <div class="card">
                        <div class="card-body">
                            <div class="form-group">
                                <label for="fname">First Name</label>
                                <input id="fname" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="lname">Last Name</label>
                                <input id="lname" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input id="email" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="contact">Contact</label>
                                <input id="contact" class="form-control">
                            </div>
                            <button type="submit" id="addStudent" class="btn btn-outline-primary btn-block">Add
                                Student</button>
                            <button type="button" id="addStudent"
                                class="btn btn-outline-primary btn-block d-none">Update Student</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2 mt-2">
                <table class="table table-bordered bg-white">
                    <thead>
                        <tr>
                            <th>Sr. No</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Contact</th>
                            <th>Edit</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody id="studentContainer">
                        <tr>
                            <td>1</td>
                            <td>Jhon</td>
                            <td>Doe</td>
                            <td>jhon@gmail.com</td>
                            <td>1234567890</td>
                            <td class="text-center"><i class="fa-solid fa-user-pen fa-2x text-success"
                                    role="button"></i></td>
                            <td class="text-center"><i class="fa-solid fa-trash fa-2x text-danger" role="button"></i>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="loader d-none" id="loader">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="./assets/js/app.js"></script>
</body>

</html>
